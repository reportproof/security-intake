name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: npm run check:syntax
      - run: npm test
      - run: npm run eval
      - run: npm run check:benchmark-results
      - run: npm run check:oss-trial-results
      - run: npm run check
      - run: npm run demo:bad
      - run: node dist/cli.js examples/ai-slop-report.md --json --no-fail
      - name: JavaScript action smoke test
        id: intake
        uses: ./
        with:
          report-path: examples/ai-slop-report.md
          config-path: .security-intake.yml
          format: markdown
          fail-on-low-quality: "false"
      - name: Check action outputs
        run: |
          test "${{ steps.intake.outputs.decision }}" = "likely_low_quality_or_ai_generated"
          test "${{ steps.intake.outputs.exit-code }}" = "2"
          test -f "${{ steps.intake.outputs.result-path }}"
      - run: npm run pack:dry-run
