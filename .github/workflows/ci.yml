name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check:syntax
      - run: npm test
      - run: npm run check
      - run: npm run demo:bad
      - run: node src/cli.js examples/ai-slop-report.md --json --no-fail
      - name: Composite action smoke test
        id: intake
        uses: ./
        with:
          report-path: examples/ai-slop-report.md
          config-path: .security-intake.yml
          format: markdown
          fail-on-low-quality: "false"
      - name: Check action outputs
        run: |
          test "${{ steps.intake.outputs.decision }}" = "likely_low_quality_or_ai_generated"
          test "${{ steps.intake.outputs.exit-code }}" = "2"
          test -f "${{ steps.intake.outputs.result-path }}"
      - run: npm run pack:dry-run
