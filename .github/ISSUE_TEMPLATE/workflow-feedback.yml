name: Workflow feedback
description: Tell us how this could fit or fail in a maintainer/security workflow.
title: "[workflow] "
labels:
  - feedback
  - workflow
body:
  - type: markdown
    attributes:
      value: |
        Use this form for workflow critique: where `security-intake` would save time, create friction, or need different output.

        Do not include private vulnerability details. Describe the workflow, not a live report.
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - open-source maintainer
        - commercial OSS maintainer
        - AppSec/product security
        - bug bounty or VDP triage
        - security researcher
        - other
    validations:
      required: true
  - type: input
    id: project-type
    attributes:
      label: Project or program type
      description: Example framework SDK, runtime, package manager, SaaS OSS repo, VDP, bug bounty program.
      placeholder: framework SDK
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: How do reports arrive and get triaged today? Include tools or queues if safe.
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: Where this could help
      description: Be specific about the step, queue, or maintainer action.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Where this could be annoying or unsafe
      description: What would make you reject this workflow?
    validations:
      required: true
  - type: dropdown
    id: adoption
    attributes:
      label: Would you try this in the next 30 days?
      options:
        - yes, as CLI only
        - yes, as GitHub Action
        - maybe, after output/rule changes
        - no, not useful for this workflow
        - unsure
    validations:
      required: true
  - type: textarea
    id: success-signal
    attributes:
      label: What would prove value?
      description: What outcome would convince you this saves maintainer or triage time?
    validations:
      required: false
